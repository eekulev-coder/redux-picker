<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internal Docs</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
--bg:#0a0510;--bg2:#100818;--surface:#160d1c;--surface2:#1e1226;
--border:rgba(255,255,255,.08);--border-h:rgba(255,255,255,.15);
--text:#f5f0f5;--text2:#a09098;--text3:#605058;
--s1:#e5a4c4;--s3:#c4a8d9;--s5:#a8c0e0;
--green:#a3e635;--red:#f472b6;--yellow:#facc15;--gold:#ffd700;--blue:#60a5fa;
--grad:linear-gradient(120deg,#e5a4c4,#c4a8d9,#a8b0e0);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--s3);border-radius:4px}
a{color:var(--s1);text-decoration:none}
button{cursor:pointer;font-family:inherit}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:40px;max-width:400px;width:100%}
.login-title{font-family:'Unbounded',sans-serif;font-size:1.6rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:6px}
.login-sub{color:var(--text2);font-size:.85rem;margin-bottom:24px}
.field{margin-bottom:14px}
.field label{display:block;font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;font-weight:600;font-family:'Unbounded',sans-serif}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:.9rem}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--s1);box-shadow:0 0 0 3px rgba(229,164,196,.15)}
.field textarea{min-height:60px;resize:vertical}
.btn{padding:14px 28px;background:var(--grad);color:#000;font-weight:800;font-size:.8rem;letter-spacing:1.5px;text-transform:uppercase;border:none;border-radius:10px;transition:all .3s;font-family:'Unbounded',sans-serif}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(229,164,196,.4)}
.btn-sec{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
.btn-sec:hover{border-color:var(--s1);color:var(--s1);box-shadow:none}
.btn-danger{background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.4);color:#ef4444}
.btn-danger:hover{background:rgba(239,68,68,.25);box-shadow:none}
.btn-gold{background:linear-gradient(135deg,#ffd700,#ffb000);color:#000}
.btn-gold:hover{box-shadow:0 8px 25px rgba(255,215,0,.4)}
.msg{padding:12px 16px;border-radius:10px;font-size:.85rem;margin-top:14px;display:none;font-weight:600}
.msg.show{display:block}
.msg.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#ef4444}
.msg.ok{background:rgba(163,230,53,.1);border:1px solid rgba(163,230,53,.3);color:#a3e635}

.admin{display:none}
.admin.active{display:block}
.top{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 30px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;backdrop-filter:blur(20px)}
.top-title{font-family:'Unbounded',sans-serif;font-size:1.2rem;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800}
.top-right{display:flex;align-items:center;gap:15px}
.top-user{font-size:.85rem;color:var(--text2)}
.top-user b{color:var(--s1)}
.online-admins{display:flex;gap:6px;align-items:center;padding:6px 12px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:.7rem;color:var(--text2);font-family:'Unbounded',sans-serif;font-weight:600}
.online-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.top-btn{padding:8px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:.75rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;transition:all .3s;font-family:'Unbounded',sans-serif}
.top-btn:hover{border-color:var(--s1);color:var(--s1)}

.tabs{display:flex;gap:6px;padding:20px 30px 0;border-bottom:1px solid var(--border);background:var(--surface);overflow-x:auto}
.tab{padding:12px 20px;background:transparent;border:none;color:var(--text2);font-family:'Unbounded',sans-serif;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;border-bottom:2px solid transparent;transition:all .3s;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.active{color:var(--s1);border-bottom-color:var(--s1)}
.tab-badge{background:var(--s1);color:#000;font-size:.6rem;padding:2px 6px;border-radius:10px;margin-left:6px;font-weight:800}

.main{padding:30px;max-width:1400px;margin:0 auto}
.page{display:none}
.page.active{display:block}
.section-head{margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px}
.section-title{font-family:'Unbounded',sans-serif;font-size:1.4rem;font-weight:700}
.section-desc{color:var(--text2);font-size:.85rem;margin-top:4px}

.pending-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;margin-bottom:20px;transition:border-color .3s;position:relative}
.pending-card:hover{border-color:var(--s3)}
.pending-card.locked-by-other{opacity:.7;pointer-events:none}
.pending-card.locked-by-other::after{content:'';position:absolute;inset:0;background:rgba(10,5,16,.4);z-index:5;pointer-events:none;border-radius:16px}
.lock-badge{position:absolute;top:14px;right:14px;background:rgba(96,165,250,.2);color:var(--blue);border:1px solid rgba(96,165,250,.4);padding:6px 12px;border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.5px;z-index:10;font-family:'Unbounded',sans-serif;display:flex;align-items:center;gap:6px}
.pending-header{padding:14px 20px;background:var(--surface2);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;border-bottom:1px solid var(--border)}
.pending-meta{display:flex;gap:15px;align-items:center;flex-wrap:wrap;font-size:.75rem;color:var(--text2)}
.pending-meta i{color:var(--s1);margin-right:4px}
.pending-status{padding:4px 12px;border-radius:20px;font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:1px;background:rgba(250,204,21,.15);color:var(--yellow);border:1px solid rgba(250,204,21,.3);font-family:'Unbounded',sans-serif}
.pending-body{padding:20px}

.pending-videos{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin-bottom:20px}
.pending-video{background:var(--bg);border:2px solid var(--border);border-radius:12px;overflow:hidden;cursor:pointer;transition:all .3s;position:relative}
.pending-video:hover{border-color:var(--s3)}
.pending-video.selected{border-color:var(--s1);box-shadow:0 0 0 3px rgba(229,164,196,.2)}

.pending-video-thumb{position:relative;width:100%;padding-top:56.25%;background:var(--bg2);cursor:pointer;overflow:hidden}
.pending-video-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pending-video-thumb iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
.play-btn{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:60px;height:60px;background:rgba(0,0,0,.7);border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;transition:all .2s;z-index:2;border:none;cursor:pointer}
.play-btn:hover{background:var(--s1);color:#000;transform:translate(-50%,-50%) scale(1.1)}
.play-btn i{margin-left:4px}

.pending-video-info{padding:10px}
.pending-video-title{font-size:.85rem;font-weight:700;margin-bottom:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pending-video-author{font-size:.7rem;color:var(--text2)}
.pending-video-check{position:absolute;top:8px;right:8px;width:28px;height:28px;background:var(--s1);border-radius:50%;display:none;align-items:center;justify-content:center;color:#000;font-size:.75rem;font-weight:800;z-index:3;box-shadow:0 4px 12px rgba(229,164,196,.5)}
.pending-video.selected .pending-video-check{display:flex}

.pending-drive{padding:12px 16px;background:var(--bg);border-radius:10px;font-size:.8rem;color:var(--text2);margin-bottom:20px;display:flex;align-items:center;gap:10px;word-break:break-all;flex-wrap:wrap}
.pending-drive i{color:#4285f4;font-size:1rem;flex-shrink:0}
.drive-filename{margin-left:auto;background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.3);padding:4px 10px;border-radius:8px;color:var(--blue);font-size:.75rem;font-weight:600;font-family:'Unbounded',sans-serif}
.drive-filename.generic{background:rgba(250,204,21,.1);border-color:rgba(250,204,21,.3);color:var(--yellow)}

.name-suggestions{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.name-suggestion{padding:5px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:20px;font-size:.7rem;color:var(--text2);cursor:pointer;transition:all .2s;font-family:'Space Grotesk',sans-serif}
.name-suggestion:hover{border-color:var(--s1);color:var(--s1);background:var(--surface)}
.name-suggestion.from-gdrive{color:var(--blue);border-color:rgba(96,165,250,.3)}
.name-suggestion.from-gdrive:hover{border-color:var(--blue);color:var(--blue);background:rgba(96,165,250,.1)}
.name-suggestion.active{background:var(--s1);color:#000;border-color:var(--s1)}

.edit-form{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.edit-form .full{grid-column:span 2}

.type-row{display:flex;gap:8px}
.type-opt{flex:1;padding:12px;background:var(--bg);border:2px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;font-weight:700;font-size:.85rem;transition:all .2s;font-family:'Unbounded',sans-serif}
.type-opt.active{border-color:var(--s1);background:rgba(229,164,196,.1);color:var(--s1)}

.color-row{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px}
.color-opt{width:32px;height:32px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:all .2s;position:relative}
.color-opt:hover{transform:scale(1.15)}
.color-opt.active{border-color:#fff;box-shadow:0 0 12px currentColor;transform:scale(1.15)}

.tags-input-wrap{position:relative}
.tags-container{display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;min-height:44px;align-items:center;cursor:text}
.tags-container:focus-within{border-color:var(--s1);box-shadow:0 0 0 3px rgba(229,164,196,.15)}
.tag-chip{display:inline-flex;align-items:center;gap:6px;background:var(--s1);color:#000;padding:4px 10px;border-radius:20px;font-size:.75rem;font-weight:700;font-family:'Unbounded',sans-serif}
.tag-chip button{background:none;border:none;color:#000;cursor:pointer;padding:0;font-size:.85rem;line-height:1;opacity:.7;transition:opacity .2s}
.tag-chip button:hover{opacity:1}
.tags-input{flex:1;min-width:100px;background:transparent;border:none;outline:none;color:var(--text);font-family:inherit;font-size:.85rem;padding:4px}

.tag-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-top:4px;max-height:200px;overflow-y:auto;z-index:100;display:none;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.tag-dropdown.show{display:block}
.tag-dropdown-item{padding:10px 14px;cursor:pointer;font-size:.85rem;color:var(--text);display:flex;justify-content:space-between;align-items:center;transition:background .2s}
.tag-dropdown-item:hover,.tag-dropdown-item.highlighted{background:var(--surface2);color:var(--s1)}
.tag-count{color:var(--text3);font-size:.7rem}
.tag-new{color:var(--green);font-size:.65rem;font-weight:700}

.pending-actions{display:flex;gap:10px;flex-wrap:wrap;padding-top:15px;border-top:1px solid var(--border)}

.approved-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.approved-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;transition:all .3s;position:relative}
.approved-card:hover{border-color:var(--s1)}
.approved-card.is-day{border-color:var(--gold);box-shadow:0 0 30px rgba(255,215,0,.3)}
.approved-card.is-day::before{content:'⭐ МОД ДНЯ';position:absolute;top:8px;left:8px;background:var(--gold);color:#000;font-size:.6rem;font-weight:800;padding:4px 10px;border-radius:20px;z-index:5;font-family:'Unbounded',sans-serif}
.approved-preview{height:140px;position:relative;overflow:hidden;background:var(--bg2)}
.approved-preview img{width:100%;height:100%;object-fit:cover;opacity:.7}
.approved-color-bar{position:absolute;bottom:0;left:0;right:0;height:3px}
.approved-body{padding:14px}
.approved-name{font-weight:700;margin-bottom:4px;font-size:.95rem}
.approved-meta{font-size:.7rem;color:var(--text2);margin-bottom:10px}
.approved-stats{display:flex;gap:10px;font-size:.7rem;color:var(--text3);margin-bottom:10px}
.approved-stats i{color:var(--s1);margin-right:3px}
.approved-buttons{display:flex;flex-direction:column;gap:6px}

.empty{text-align:center;padding:60px 20px;color:var(--text3)}
.empty i{font-size:4rem;opacity:.3;margin-bottom:16px;display:block}
.empty h3{color:var(--text2);margin-bottom:8px;font-family:'Unbounded',sans-serif}
.empty p{font-size:.85rem}

.toast{position:fixed;top:20px;right:20px;background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--s1);padding:14px 20px;border-radius:10px;font-size:.85rem;z-index:9999;animation:slideIn .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 10px 30px rgba(0,0,0,.4);font-weight:600;max-width:350px}
@keyframes slideIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}

.loading{text-align:center;padding:40px;color:var(--text2)}
.loading i{font-size:2rem;color:var(--s1);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.back-link{position:fixed;top:16px;left:20px;padding:8px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text2);font-size:.75rem;font-weight:600;letter-spacing:.5px;text-transform:uppercase;transition:all .3s;font-family:'Unbounded',sans-serif;z-index:200}
.back-link:hover{border-color:var(--s1);color:var(--s1)}

.day-current{background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:24px;margin-bottom:30px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.day-current-icon{font-size:3rem}
.day-current-info{flex:1;min-width:200px}
.day-current-label{font-family:'Unbounded',sans-serif;font-size:.7rem;color:var(--gold);letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;font-weight:700}
.day-current-name{font-family:'Unbounded',sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:4px}
.day-current-meta{font-size:.85rem;color:var(--text2)}
.day-current-actions{display:flex;gap:8px;flex-wrap:wrap}
.day-search{margin-bottom:20px}
.day-search input{width:100%;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:.9rem}
.day-search input:focus{outline:none;border-color:var(--s1)}

@media(max-width:768px){
.top,.tabs{padding-left:15px;padding-right:15px}
.main{padding:20px 15px}
.edit-form{grid-template-columns:1fr}
.edit-form .full{grid-column:span 1}
.pending-videos{grid-template-columns:1fr}
.back-link{display:none}
.day-current{flex-direction:column;text-align:center}
.online-admins{display:none}
}
</style>
</head>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">

      <label>Логин</label>
      <input type="text" id="loginUser" placeholder="admin" autocomplete="off">

      <div id="pendingList"></div>
    </div>
    
    <div class="page" id="approvedPage">
      <div class="section-head">
        <div>
          <div class="section-title">Опубликованные моды</div>
          <div class="section-desc">Все моды видны на сайте</div>
        </div>
        <button class="top-btn" onclick="loadApproved()"><i class="fas fa-sync"></i> Обновить</button>
      </div>
      <div id="approvedList"></div>
    </div>
    
    <div class="page" id="modofdayPage">
      <div class="section-head">
        <div>
          <div class="section-title">⭐ Мод дня</div>
          <div class="section-desc">Выбери мод который будет отображаться на главной сайта</div>
        </div>

      </div>
      <div id="dayCurrentBox"></div>
      <div class="day-search"><input type="text" id="daySearch" placeholder="🔍 Поиск мода..."></div>
      <div id="dayModList"></div>
    </div>
  </div>
</div>

function isGenericName(name) {
  if (!name) return true;
  const cleaned = cleanFilename(name).toLowerCase().trim();
  if (cleaned.length < 3) return true;
  if (GENERIC_NAMES.includes(cleaned)) return true;
  for (const generic of GENERIC_NAMES) {
    const patterns = [
      new RegExp(`^${generic}\\s*[v]?\\d*$`, 'i'),
      new RegExp(`^${generic}\\s*(final|new|test)$`, 'i'),
      new RegExp(`^${generic}\\.(rar|zip|7z)$`, 'i'),
    ];
    if (patterns.some(p => p.test(cleaned))) return true;
  }
  return false;
}

function getSmartName(driveFilename, ytTitle) {
  const cleanedDrive = cleanFilename(driveFilename);
  if (cleanedDrive && !isGenericName(cleanedDrive)) {
    return cleanedDrive;
  }
  if (ytTitle && ytTitle.trim()) {
    return ytTitle.trim();
  }
  return cleanedDrive || 'Без названия';
}

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentAdmin = null;
let allApprovedMods = [];
let currentDayModId = null;
let allExistingTags = [];
let myLocks = new Set();
let othersLocks = new Map();

async function doLogin() {
  const login = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginErr');
  err.classList.remove('show');
  if (!login || !pass) { err.textContent = 'Заполни оба поля'; err.classList.add('show'); return; }
  try {
    const {data, error} = await sb.from('admins').select('*').eq('login', login).eq('password', pass).single();
    if (error || !data) { err.textContent = 'Неверный логин или пароль'; err.classList.add('show'); return; }
    currentAdmin = data;
    localStorage.setItem('rdx_admin', JSON.stringify(data));
    showAdmin();
  } catch(e) { err.textContent = 'Ошибка: ' + e.message; err.classList.add('show'); }
}
document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

function showAdmin() {
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('adminPanel').classList.add('active');
  document.getElementById('userName').textContent = currentAdmin.login;
  loadAllTags().then(() => {
    loadPending();
    loadApprovedCount();
  });
  initLockSystem();
}

function logout() {
  myLocks.forEach(id => releaseLock(id));
  localStorage.removeItem('rdx_admin');
  location.reload();
}

const saved = localStorage.getItem('rdx_admin');
if (saved) { currentAdmin = JSON.parse(saved); showAdmin(); }

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById(t.dataset.tab + 'Page').classList.add('active');
    if (t.dataset.tab === 'pending') loadPending();
    if (t.dataset.tab === 'approved') loadApproved();
    if (t.dataset.tab === 'modofday') loadModOfDay();
  });
});

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast'; t.innerHTML = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='0'; t.style.transform='translateX(100px)'; t.style.transition='all .3s'; setTimeout(() => t.remove(), 300); }, 3000);
}

async function loadAllTags() {
  try {
    const {data} = await sb.from('mods').select('tags');
    const tagCounts = {};
    if (data) {
      data.forEach(m => {
        (m.tags || []).forEach(t => {
          const tag = String(t).toLowerCase().trim();
          if (tag) tagCounts[tag] = (tagCounts[tag] || 0) + 1;
        });
      });
    }
    allExistingTags = Object.keys(tagCounts).map(name => ({name, count: tagCounts[name]}))
                                              .sort((a,b) => b.count - a.count);
    console.log('📌 Загружено тегов:', allExistingTags.length);
  } catch(e) {
    console.error('Ошибка загрузки тегов:', e);
    allExistingTags = [];
  }
}

function addTagsToGlobal(tags) {
  tags.forEach(tag => {
    const clean = String(tag).toLowerCase().trim();
    if (!clean) return;
    const existing = allExistingTags.find(t => t.name === clean);
    if (existing) {
      existing.count++;
    } else {
      allExistingTags.push({name: clean, count: 1});
    }
  });
  allExistingTags.sort((a,b) => b.count - a.count);
}

async function refreshAll() {
  await loadAllTags();
  loadPending();
  loadApprovedCount();
}

async function initLockSystem() {
  setInterval(refreshMyLocks, 5000);
  setInterval(checkAllLocks, 3000);
  setInterval(async () => { try { await sb.rpc('cleanup_old_locks'); } catch(e){} }, 10000);
  window.addEventListener('beforeunload', () => {
    myLocks.forEach(id => {
      navigator.sendBeacon(`${SUPABASE_URL}/rest/v1/admin_locks?pending_id=eq.${id}&admin_login=eq.${encodeURIComponent(currentAdmin.login)}`,
        new Blob([JSON.stringify({})], {type:'application/json'}));
    });
  });
  sb.channel('locks_changes').on('postgres_changes', {event:'*', schema:'public', table:'admin_locks'}, () => {
    checkAllLocks();
    updateOnlineCount();
  }).subscribe();
  await checkAllLocks();
}

async function acquireLock(pendingId) {
  try {
    const {data: existing} = await sb.from('admin_locks').select('*').eq('pending_id', pendingId).single();
    if (existing && existing.admin_login !== currentAdmin.login) {
      const age = (Date.now() - new Date(existing.locked_at).getTime()) / 1000;
      if (age < 30) return false;
      await sb.from('admin_locks').delete().eq('pending_id', pendingId);
    }
    await sb.from('admin_locks').upsert({pending_id: pendingId, admin_login: currentAdmin.login, locked_at: new Date().toISOString()}, {onConflict: 'pending_id'});
    myLocks.add(pendingId);
    return true;
  } catch(e) { return false; }
}

async function releaseLock(pendingId) {
  myLocks.delete(pendingId);
  try { await sb.from('admin_locks').delete().eq('pending_id', pendingId).eq('admin_login', currentAdmin.login); } catch(e) {}
}

async function refreshMyLocks() {
  if (myLocks.size === 0) return;
  const ids = Array.from(myLocks);
  try {
    for (const id of ids) {
      await sb.from('admin_locks').update({locked_at: new Date().toISOString()})
        .eq('pending_id', id).eq('admin_login', currentAdmin.login);
    }
  } catch(e) {}
}

async function checkAllLocks() {
  try {
    const {data} = await sb.from('admin_locks').select('*');
    othersLocks.clear();
    if (data) {
      data.forEach(lock => {
        if (lock.admin_login !== currentAdmin.login) {
          const age = (Date.now() - new Date(lock.locked_at).getTime()) / 1000;
          if (age < 30) othersLocks.set(lock.pending_id, lock.admin_login);
        }
      });
    }
    document.querySelectorAll('.pending-card').forEach(card => {
      const id = parseInt(card.dataset.pendingId);
      if (!id) return;
      const lockedBy = othersLocks.get(id);
      card.classList.toggle('locked-by-other', !!lockedBy);
      let lockBadge = card.querySelector('.lock-badge');
      if (lockedBy) {
        if (!lockBadge) {
          lockBadge = document.createElement('div');
          lockBadge.className = 'lock-badge';
          card.appendChild(lockBadge);
        }
        lockBadge.innerHTML = `<i class="fas fa-lock"></i> Редактирует ${lockedBy}`;
      } else if (lockBadge) {
        lockBadge.remove();
      }
    });
  } catch(e) {}
}

async function updateOnlineCount() {
  try {
    const {data} = await sb.from('admin_locks').select('admin_login,locked_at');
    const unique = new Set([currentAdmin.login]);
    if (data) data.forEach(l => {
      const age = (Date.now() - new Date(l.locked_at || Date.now()).getTime()) / 1000;
      if (age < 60) unique.add(l.admin_login);
    });
    const count = unique.size;
    const el = document.getElementById('onlineAdmins');
    const txt = document.getElementById('onlineAdminsText');
    if (count > 1) { el.style.display = 'flex'; txt.textContent = `${count} онлайн`; }
    else { el.style.display = 'none'; }
  } catch(e) {}
}

async function loadPending() {
  const box = document.getElementById('pendingList');
  box.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i></div>';
  const {data, error} = await sb.from('pending_mods').select('*').eq('status', 'pending').order('created_at', {ascending: false});
  if (error) { box.innerHTML = '<div class="empty"><i class="fas fa-triangle-exclamation"></i><h3>Ошибка</h3><p>'+error.message+'</p></div>'; return; }
  document.getElementById('pendingBadge').textContent = data.length;
  if (data.length === 0) { box.innerHTML = '<div class="empty"><i class="fas fa-inbox"></i><h3>Пусто</h3><p>Жду когда бот подкинет что-то 🤖</p></div>'; return; }
  box.innerHTML = '';
  data.forEach(item => box.appendChild(makePendingCard(item)));
  checkAllLocks();
}

function setupTagsInput(card, itemId) {
  const container = card.querySelector('.tags-container');
  const input = card.querySelector('.tags-input');
  const dropdown = card.querySelector('.tag-dropdown');
  card._tags = new Set();
  let highlightedIndex = -1;
  
  function addTag(tag) {
    tag = String(tag).toLowerCase().trim();
    if (!tag || card._tags.has(tag) || tag.length > 30) return;
    card._tags.add(tag);
    renderChips();
    hideDropdown();
    input.value = '';
    input.focus();
  }
  
  function removeTag(tag) {
    card._tags.delete(tag);
    renderChips();
  }
  
  function renderChips() {
    container.querySelectorAll('.tag-chip').forEach(c => c.remove());
    Array.from(card._tags).forEach(tag => {
      const chip = document.createElement('span');
      chip.className = 'tag-chip';
      chip.innerHTML = `${tag} <button title="Удалить">×</button>`;
      chip.querySelector('button').addEventListener('click', (e) => {
        e.stopPropagation();
        removeTag(tag);
      });
      container.insertBefore(chip, input);
    });
  }
  
  function updateDropdown() {
    const query = input.value.toLowerCase().trim();
    dropdown.innerHTML = '';
    highlightedIndex = -1;
    
    if (!query) {
      const top = allExistingTags.filter(t => !card._tags.has(t.name)).slice(0, 8);
      if (top.length === 0) { hideDropdown(); return; }
      top.forEach((t, i) => addDropdownItem(t.name, t.count, false, i));
      showDropdown();
      return;
    }
    
    const matches = allExistingTags.filter(t => t.name.includes(query) && !card._tags.has(t.name)).slice(0, 10);
    const isNew = !allExistingTags.find(t => t.name === query) && !card._tags.has(query);
    
    if (matches.length === 0 && !isNew) { hideDropdown(); return; }
    
    matches.forEach((t, i) => addDropdownItem(t.name, t.count, false, i));
    if (isNew) addDropdownItem(query, 0, true, matches.length);
    
    showDropdown();
  }
  
  function addDropdownItem(name, count, isNew, index) {
    const item = document.createElement('div');
    item.className = 'tag-dropdown-item';
    item.dataset.index = index;
    item.innerHTML = isNew 
      ? `<span>${name}</span><span class="tag-new">+ создать новый</span>`
      : `<span>${name}</span><span class="tag-count">${count} мод(ов)</span>`;
    item.addEventListener('mousedown', (e) => {
      e.preventDefault();
      addTag(name);
    });
    dropdown.appendChild(item);
  }
  
  function showDropdown() { dropdown.classList.add('show'); }
  function hideDropdown() { dropdown.classList.remove('show'); highlightedIndex = -1; }
  
  function updateHighlight() {
    const items = dropdown.querySelectorAll('.tag-dropdown-item');
    items.forEach(i => i.classList.remove('highlighted'));
    if (highlightedIndex >= 0 && items[highlightedIndex]) {
      items[highlightedIndex].classList.add('highlighted');
      items[highlightedIndex].scrollIntoView({block:'nearest'});
    }
  }
  
  container.addEventListener('click', () => input.focus());
  
  input.addEventListener('input', updateDropdown);
  input.addEventListener('focus', updateDropdown);
  input.addEventListener('blur', () => setTimeout(hideDropdown, 200));
  
  input.addEventListener('keydown', (e) => {
    const items = dropdown.querySelectorAll('.tag-dropdown-item');
    
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (items.length === 0) return;
      highlightedIndex = Math.min(highlightedIndex + 1, items.length - 1);
      updateHighlight();
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      highlightedIndex = Math.max(highlightedIndex - 1, -1);
      updateHighlight();
    } else if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault();
      if (highlightedIndex >= 0 && items[highlightedIndex]) {
        items[highlightedIndex].dispatchEvent(new MouseEvent('mousedown'));
      } else if (input.value.trim()) {
        addTag(input.value);
      }
    } else if (e.key === 'Escape') {
      hideDropdown();
    } else if (e.key === 'Backspace' && !input.value && card._tags.size > 0) {
      const last = Array.from(card._tags).pop();
      removeTag(last);
    }
  });
}

async function approveMod(item, card) {
  if (othersLocks.has(item.id)) {
    toast('🔒 Заявку редактирует другой админ');
    return;
  }
  const selectedVideo = card.querySelector('.pending-video.selected');
  const idx = parseInt(selectedVideo.dataset.idx);
  const selectedType = card.querySelector('.type-opt.active').dataset.type;
  const selectedColor = card.querySelector('.color-opt.active');
  if (!selectedColor) { toast('❌ Выбери цвет!'); return; }
  const name = card.querySelector('.edit-name').value.trim();
  const author = card.querySelector('.edit-author').value.trim();
  const badge = card.querySelector('.edit-badge').value || null;
  const desc = card.querySelector('.edit-desc').value.trim() || 'Описание скоро появится.';
  const tags = Array.from(card._tags || []);
  if (!name || !author) { toast('❌ Заполни название и автора!'); return; }
  const ytUrl = item.youtube_urls[idx];
  const ytIdMatch = ytUrl.match(/(?:youtu\.be\/|v=)([a-zA-Z0-9_-]{11})/);
  const preview = item.preview_images[idx];
  const hex = selectedColor.dataset.hex;
  try {
    const {error: e1} = await sb.from('mods').insert({
      type: selectedType, name: name, author: author, color: hex, color_name: selectedColor.dataset.color,
      youtube_url: ytUrl, youtube_id: ytIdMatch ? ytIdMatch[1] : '', drive_url: item.drive_url,
      preview_image: preview, description: desc, tags: tags, badge: badge, palette: [hex, hex, hex, hex],
      drive_filename: item.drive_filename || null
    });
    if (e1) throw e1;
    await sb.from('pending_mods').delete().eq('id', item.id);
    await releaseLock(item.id);
    
    addTagsToGlobal(tags);
    
    toast('✅ Мод "'+name+'" опубликован!');
    loadPending(); loadApprovedCount();
  } catch(e) { toast('❌ Ошибка: ' + e.message); }
}

async function rejectMod(id) {
  if (othersLocks.has(id)) {
    toast('🔒 Заявку редактирует другой админ');
    return;
  }
  if (!confirm('Отклонить заявку?')) return;
  await sb.from('pending_mods').delete().eq('id', id);
  await releaseLock(id);
  toast('❌ Отклонено'); loadPending();
}

async function loadApproved() {
  const box = document.getElementById('approvedList');
  box.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i></div>';
  const {data, error} = await sb.from('mods').select('*').order('created_at', {ascending: false});
  if (error) { box.innerHTML = '<div class="empty"><i class="fas fa-triangle-exclamation"></i><h3>Ошибка</h3></div>'; return; }
  const {data: settingData} = await sb.from('site_settings').select('value').eq('key', 'mod_of_day_id').single();
  const dayId = settingData && settingData.value ? parseInt(settingData.value) : null;
  document.getElementById('approvedBadge').textContent = data.length;
  if (data.length === 0) { box.innerHTML = '<div class="empty"><i class="fas fa-folder-open"></i><h3>Нет модов</h3><p>Одобри первую заявку!</p></div>'; return; }
  box.className = 'approved-grid'; box.innerHTML = '';
  data.forEach(r => {
    const isDay = r.id === dayId;
    const card = document.createElement('div');
    card.className = 'approved-card' + (isDay ? ' is-day' : '');
    // Умное отображение имени в списке
    let displayName = r.name;
    if (r.drive_filename) {
      const cleaned = cleanFilename(r.drive_filename);
      if (cleaned && !isGenericName(cleaned)) displayName = cleaned;
    }
    card.innerHTML = `
      <div class="approved-preview"><img src="${r.preview_image||''}" onerror="this.style.display='none'"><div class="approved-color-bar" style="background:${r.color}"></div></div>
      <div class="approved-body">
        <div class="approved-name">${displayName}</div>
        <div class="approved-meta">👤 ${r.author} · ${r.type==='redux'?'✨ Redux':'💫 REV'} · 🎨 ${r.color_name}</div>
        <div class="approved-stats"><span><i class="fas fa-star"></i>${r.rating||5}</span><span><i class="fas fa-download"></i>${r.downloads||0}</span></div>
        <div class="approved-buttons">
          <button class="btn btn-danger" style="width:100%;padding:8px" onclick="deleteMod(${r.id},'${displayName.replace(/'/g,"\\'")}')"><i class="fas fa-trash"></i> Удалить</button>
        </div>
      </div>`;
    box.appendChild(card);
  });
}

async function deleteMod(id, name) {
  if (!confirm('Удалить "'+name+'" с сайта?')) return;
  await sb.from('mods').delete().eq('id', id);
  toast('🗑️ Удалено'); loadApproved(); loadAllTags();
}

async function loadModOfDay() {
  const currentBox = document.getElementById('dayCurrentBox');
  const listBox = document.getElementById('dayModList');
  currentBox.innerHTML = '<div class="loading"><i class="fas fa-spinner"></i></div>';
  listBox.innerHTML = '';
  try {
    const [{data: mods}, {data: setting}] = await Promise.all([
      sb.from('mods').select('*').order('name', {ascending: true}),
      sb.from('site_settings').select('value').eq('key', 'mod_of_day_id').single()
    ]);
    allApprovedMods = mods || [];
    currentDayModId = setting && setting.value ? parseInt(setting.value) : null;
    renderDayCurrent();
    renderDayModList('');
  } catch(e) {
    currentBox.innerHTML = '<div class="empty"><i class="fas fa-triangle-exclamation"></i><h3>Ошибка</h3></div>';
  }
}

function getDisplayName(mod) {
  if (mod.drive_filename) {
    const cleaned = cleanFilename(mod.drive_filename);
    if (cleaned && !isGenericName(cleaned)) return cleaned;
  }
  return mod.name;
}

function renderDayCurrent() {
  const box = document.getElementById('dayCurrentBox');
  if (!currentDayModId) {
    box.innerHTML = `<div class="day-current"><div class="day-current-icon">🎲</div><div class="day-current-info"><div class="day-current-label">⭐ мод дня</div><div class="day-current-name">Автоматически (по рейтингу)</div><div class="day-current-meta">Сайт сам выбирает мод с самым высоким рейтингом</div></div></div>`;
    return;
  }
  const mod = allApprovedMods.find(m => m.id === currentDayModId);
  if (!mod) {
    box.innerHTML = `<div class="day-current"><div class="day-current-icon">⚠️</div><div class="day-current-info"><div class="day-current-label">⭐ мод дня</div><div class="day-current-name">Не найден</div><div class="day-current-meta">Мод был удалён — вернись к автоматическому режиму</div></div><div class="day-current-actions"><button class="btn btn-sec" onclick="clearDayMod()"><i class="fas fa-times"></i> Сбросить</button></div></div>`;
    return;
  }
  const displayName = getDisplayName(mod);
  box.innerHTML = `<div class="day-current"><div class="day-current-icon">${mod.type==='redux'?'✨':'💫'}</div><div class="day-current-info"><div class="day-current-label">⭐ сейчас на главной</div><div class="day-current-name">${displayName}</div><div class="day-current-meta">👤 ${mod.author} · 🎨 ${mod.color_name} · ⭐ ${mod.rating}</div></div><div class="day-current-actions"><button class="btn btn-sec" onclick="clearDayMod()"><i class="fas fa-magic"></i> Автовыбор</button></div></div>`;
}

function renderDayModList(query) {
  const box = document.getElementById('dayModList');
  if (allApprovedMods.length === 0) {
    box.innerHTML = '<div class="empty"><i class="fas fa-folder-open"></i><h3>Нет модов</h3></div>';
    return;
  }
  let filtered = allApprovedMods;
  if (query) {
    const q = query.toLowerCase();
    filtered = allApprovedMods.filter(m => {
      const displayName = getDisplayName(m).toLowerCase();
      return displayName.includes(q) || m.author.toLowerCase().includes(q);
    });
  }
  if (filtered.length === 0) {
    box.innerHTML = '<div class="empty"><i class="fas fa-search"></i><h3>Ничего не найдено</h3></div>';
    return;
  }
  box.className = 'approved-grid';
  box.innerHTML = '';
  filtered.forEach(r => {
    const isDay = r.id === currentDayModId;
    const displayName = getDisplayName(r);
    const card = document.createElement('div');
    card.className = 'approved-card' + (isDay ? ' is-day' : '');
    card.innerHTML = `
      <div class="approved-preview"><img src="${r.preview_image||''}" onerror="this.style.display='none'"><div class="approved-color-bar" style="background:${r.color}"></div></div>
      <div class="approved-body">
        <div class="approved-name">${displayName}</div>
        <div class="approved-meta">👤 ${r.author} · ${r.type==='redux'?'✨ Redux':'💫 REV'}</div>
        <div class="approved-stats"><span><i class="fas fa-star"></i>${r.rating||5}</span><span><i class="fas fa-download"></i>${r.downloads||0}</span></div>
        ${isDay ? '<button class="btn btn-sec" style="width:100%;padding:8px" disabled><i class="fas fa-check"></i> Уже мод дня</button>' : `<button class="btn btn-gold" style="width:100%;padding:8px" onclick="setDayMod(${r.id},'${displayName.replace(/'/g,"\\'")}')"><i class="fas fa-star"></i> Сделать модом дня</button>`}
      </div>`;
    box.appendChild(card);
  });
}

async function setDayMod(id, name) {
  try {
    await sb.from('site_settings').upsert({key: 'mod_of_day_id', value: String(id), updated_at: new Date().toISOString()}, {onConflict: 'key'});
    currentDayModId = id;
    toast('⭐ "'+name+'" теперь мод дня!');
    renderDayCurrent();
    renderDayModList(document.getElementById('daySearch').value);
  } catch(e) { toast('❌ Ошибка: ' + e.message); }
}

async function clearDayMod() {
  if (!confirm('Вернуть автовыбор (по рейтингу)?')) return;
  try {
    await sb.from('site_settings').upsert({key: 'mod_of_day_id', value: '', updated_at: new Date().toISOString()}, {onConflict: 'key'});
    currentDayModId = null;
    toast('🎲 Автовыбор включён');
    renderDayCurrent();
    renderDayModList(document.getElementById('daySearch').value);
  } catch(e) { toast('❌ Ошибка: ' + e.message); }
}

document.getElementById('daySearch').addEventListener('input', e => renderDayModList(e.target.value));

sb.channel('pending_changes').on('postgres_changes', {event:'INSERT', schema:'public', table:'pending_mods'}, () => {
  if (currentAdmin) { toast('🔔 Новая заявка!'); loadPending(); }
}).subscribe();

sb.channel('mods_tags_sync').on('postgres_changes', {event:'INSERT', schema:'public', table:'mods'}, () => {
  loadAllTags();
}).subscribe();
</script>
</body>
</html>
